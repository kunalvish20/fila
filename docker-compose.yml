services:
  postgres:
    image: postgres:16-alpine
    container_name: filament_inventory_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: filament_inventory
    ports:
      - "5432:5432"
    volumes:
      - filament_inventory_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d filament_inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  filament_inventory_pgdata:
